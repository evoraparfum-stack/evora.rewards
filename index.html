<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EVORA Rewards</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0d0d0d;
      --gold: #c9a227;
      --gold-light: #f5e7ad;
      --bg: #f6f5f1;
      --gray: #747474;
      --border: #e4e4e4;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(201,162,39,.15),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #faf9f5 0%,
          #f4f4f2 100%
        );

      color: var(--black);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .container {
      width: min(100%, 540px);
      margin: auto;
      padding: 38px 18px 55px;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand-logo {
      width: 82px;
      height: 82px;

      margin: auto;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: white;

      font-size: 29px;
      font-weight: 900;

      letter-spacing: 1px;

      box-shadow:
        0 18px 45px rgba(0,0,0,.16);
    }

    .brand h1 {
      margin-top: 20px;

      font-size: clamp(30px, 8vw, 42px);

      font-weight: 900;

      letter-spacing: -1.8px;
    }

    .brand p {
      margin-top: 8px;

      color: var(--gray);

      font-size: 15px;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: rgba(255,255,255,.94);

      border:
        1px solid rgba(0,0,0,.06);

      border-radius: 30px;

      padding: 25px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.09);

      backdrop-filter: blur(20px);
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h2 {
      font-size: 25px;
      font-weight: 850;
    }

    .title p {
      margin-top: 8px;

      color: var(--gray);

      font-size: 14px;

      line-height: 1.55;
    }

    /* =========================
       FORM
    ========================= */

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 750;
    }

    input {
      width: 100%;
      height: 56px;

      border: 1px solid #dedede;

      border-radius: 17px;

      background: #fafafa;

      padding: 0 17px;

      font-size: 17px;

      outline: none;

      transition: .2s;
    }

    input:focus {
      border-color: var(--gold);

      background: white;

      box-shadow:
        0 0 0 4px rgba(201,162,39,.11);
    }

    input:disabled {
      opacity: .65;
    }

    /* =========================
       BUTTON
    ========================= */

    .btn {
      width: 100%;
      height: 57px;

      border: none;

      border-radius: 17px;

      cursor: pointer;

      font-size: 16px;

      font-weight: 850;

      letter-spacing: .2px;

      transition: .2s;
    }

    .btn-primary {
      background: #111;
      color: white;

      box-shadow:
        0 12px 28px rgba(0,0,0,.18);
    }

    .btn-primary:active {
      transform: scale(.985);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: none;

      margin-top: 16px;

      padding: 14px 16px;

      border-radius: 15px;

      font-size: 13px;

      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fff0f0;
      color: #a21b1b;
    }

    .status.success {
      background: #effaf1;
      color: #17652a;
    }

    /* =========================
       SPIN AREA
    ========================= */

    .spin-area {
      display: none;

      margin-top: 26px;

      text-align: center;
    }

    .spin-area.show {
      display: block;
    }

    .wheel-wrap {
      position: relative;

      width: min(84vw, 380px);
      height: min(84vw, 380px);

      margin:
        15px auto
        28px;
    }

    .pointer {
      position: absolute;

      z-index: 10;

      top: -8px;
      left: 50%;

      transform:
        translateX(-50%);

      width: 0;
      height: 0;

      border-left:
        17px solid transparent;

      border-right:
        17px solid transparent;

      border-top:
        34px solid #111;

      filter:
        drop-shadow(
          0 4px 5px
          rgba(0,0,0,.25)
        );
    }

    .wheel {
      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        9px solid #111;

      box-shadow:
        0 22px 55px rgba(0,0,0,.2),
        inset 0 0 0 3px
        rgba(255,255,255,.65);

      transition:
        transform
        5.2s
        cubic-bezier(.12,.78,.1,1);

      overflow: hidden;
    }

    .wheel-center {
      position: absolute;

      z-index: 8;

      width: 76px;
      height: 76px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background: white;

      border:
        7px solid #111;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;

      box-shadow:
        0 7px 20px rgba(0,0,0,.22);
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      display: none;

      margin-top: 22px;

      padding: 27px 18px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          #fffaf0,
          #ffffff
        );

      border:
        1px solid
        rgba(201,162,39,.35);

      animation:
        resultPop .5s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes resultPop {
      from {
        opacity: 0;
        transform: scale(.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result-icon {
      font-size: 50px;
    }

    .result h3 {
      margin-top: 10px;

      font-size: 26px;

      font-weight: 900;
    }

    .result p {
      margin-top: 9px;

      color: var(--gray);

      font-size: 14px;

      line-height: 1.55;
    }

    .result-code {
      margin-top: 17px;

      padding: 13px;

      background: #f5f5f5;

      border-radius: 13px;

      font-weight: 800;

      font-size: 13px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      margin-top: 27px;

      color: #999;

      font-size: 11px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      display: none;

      margin-top: 15px;

      text-align: center;

      color: var(--gray);

      font-size: 13px;
    }

    .loading.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 430px) {

      .container {
        padding:
          28px 14px 45px;
      }

      .card {
        padding: 21px 17px;
        border-radius: 25px;
      }

      .brand h1 {
        font-size: 32px;
      }

      .title h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BRAND -->

    <div class="brand">

      <div class="brand-logo">
        EV
      </div>

      <h1>
        EVORA REWARDS
      </h1>

      <p>
        Spin your chance. Discover your reward.
      </p>

    </div>


    <!-- MAIN CARD -->

    <div class="card">

      <div class="title">

        <h2>
          🎁 EVORA Rewards
        </h2>

        <p>
          Masukkan nomor WhatsApp dan kode kartu
          EVORA untuk mendapatkan kesempatan spin.
        </p>

      </div>


      <!-- PHONE -->

      <div class="field">

        <label for="phone">
          Nomor WhatsApp
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Contoh: 081234567890"
        >

      </div>


      <!-- CARD CODE -->

      <div class="field">

        <label for="cardCode">
          Kode Kartu
        </label>

        <input
          id="cardCode"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="Contoh: EVR-XXXXXXXXXX"
        >

      </div>


      <!-- START -->

      <button
        id="startBtn"
        class="btn btn-primary"
        onclick="startReward()"
      >
        MULAI REWARDS
      </button>


      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >
        Memeriksa kartu dan menyiapkan hadiah...
      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status"
      ></div>


      <!-- SPIN -->

      <div
        id="spinArea"
        class="spin-area"
      >

        <div class="wheel-wrap">

          <div class="pointer"></div>

          <div
            id="wheel"
            class="wheel"
          ></div>

          <div class="wheel-center">
            EVORA
          </div>

        </div>


        <button
          id="spinBtn"
          class="btn btn-primary"
          onclick="animateResult()"
          disabled
        >
          PUTAR SEKARANG
        </button>


        <!-- RESULT -->

        <div
          id="result"
          class="result"
        >

          <div class="result-icon">
            🎉
          </div>

          <h3 id="resultTitle">
            Selamat!
          </h3>

          <p id="resultDescription">
          </p>

          <div
            id="resultCode"
            class="result-code"
            style="display:none;"
          ></div>

        </div>

      </div>

    </div>


    <div class="footer">
      EVORA Rewards · One card, one chance
    </div>

  </div>


  <script>

    /* =====================================================
       SUPABASE CONFIG
    ===================================================== */

    const SUPABASE_URL =
      "https://bkwcgdlwdbccbuczhtac.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dp2VMN6xlQVY1SsxXrUPkg_Wi5BXoYs";


    const {
      createClient
    } = supabase;


    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       STATE
    ===================================================== */

    let rewardData = null;

    let spinning = false;

    let rotation = 0;


    /*
      Ini hanya untuk VISUAL wheel.

      Urutan harus sama dengan urutan
      reward yang kita buat di database.
    */

    const rewardNames = [
      "Free Pocket 20ML",
      "Kode Diskon Rp5.000",
      "Kode Diskon Rp10.000",
      "Diskon 20%",
      "Diskon 10%",
      "Emas 0,0001g",
      "Parfum 30ML"
    ];


    /* =====================================================
       ELEMENT
    ===================================================== */

    const phone =
      document.getElementById("phone");

    const cardCode =
      document.getElementById("cardCode");

    const startBtn =
      document.getElementById("startBtn");

    const spinBtn =
      document.getElementById("spinBtn");

    const loading =
      document.getElementById("loading");

    const status =
      document.getElementById("status");

    const spinArea =
      document.getElementById("spinArea");

    const wheel =
      document.getElementById("wheel");

    const result =
      document.getElementById("result");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultDescription =
      document.getElementById("resultDescription");

    const resultCode =
      document.getElementById("resultCode");


    /* =====================================================
       WHEEL VISUAL
    ===================================================== */

    function createWheel() {

      const colors = [
        "#111111",
        "#c9a227",
        "#222222",
        "#e0c65a",
        "#111111",
        "#d8bc4c",
        "#333333"
      ];


      const segment =
        360 / rewardNames.length;


      let gradient = "";


      rewardNames.forEach(
        (name, index) => {

          const start =
            index * segment;

          const end =
            (index + 1) * segment;


          gradient +=
            `${colors[index]} ${start}deg ${end}deg`;


          if (
            index <
            rewardNames.length - 1
          ) {
            gradient += ", ";
          }

        }
      );


      wheel.style.background =
        `conic-gradient(${gradient})`;
    }


    createWheel();


    /* =====================================================
       HELPERS
    ===================================================== */

    function normalizePhone(value) {

      return value
        .replace(/\D/g, "")
        .trim();

    }


    function normalizeCode(value) {

      return value
        .trim()
        .toUpperCase();

    }


    function showStatus(
      message,
      type = "error"
    ) {

      status.textContent =
        message;

      status.className =
        "status show " + type;

    }


    function hideStatus() {

      status.textContent =
        "";

      status.className =
        "status";

    }


    function setLoading(
      active
    ) {

      loading.classList.toggle(
        "show",
        active
      );

      startBtn.disabled =
        active;

    }


    /* =====================================================
       START REWARD
    ===================================================== */

    async function startReward() {

      hideStatus();


      const phoneValue =
        normalizePhone(
          phone.value
        );


      const codeValue =
        normalizeCode(
          cardCode.value
        );


      if (!phoneValue) {

        showStatus(
          "Masukkan nomor WhatsApp terlebih dahulu."
        );

        return;
      }


      if (!codeValue) {

        showStatus(
          "Masukkan kode kartu terlebih dahulu."
        );

        return;
      }


      setLoading(true);


      try {

        /*
          ==================================================
          PENTING

          Website TIDAK lagi mengakses:

          customers
          card_codes
          spins
          spin_rewards

          secara langsung.

          Semuanya diproses oleh RPC.
          ==================================================
        */


        const {
          data,
          error
        } = await db.rpc(
          "start_evora_spin",
          {
            p_phone:
              phoneValue,

            p_code:
              codeValue
          }
        );


        if (error) {

          console.error(
            "RPC ERROR:",
            error
          );

          throw new Error(
            error.message ||
            "Gagal memproses reward."
          );
        }


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            "Reward gagal diproses."
          );
        }


        /*
          Simpan hasil.

          Hadiah SUDAH ditentukan
          oleh database pada tahap ini.
        */

        rewardData =
          data;


        /*
          Kunci input.
        */

        phone.disabled =
          true;

        cardCode.disabled =
          true;

        startBtn.style.display =
          "none";


        /*
          Tampilkan wheel.
        */

        spinArea.classList.add(
          "show"
        );


        spinBtn.disabled =
          false;


        showStatus(
          "Kartu valid. Putar wheel untuk melihat hadiah kamu!",
          "success"
        );


      } catch (error) {

        console.error(error);


        let message =
          error.message ||
          "Terjadi kesalahan.";


        /*
          Pesan lebih ramah.
        */

        if (
          message
            .toLowerCase()
            .includes("sudah pernah")
        ) {

          message =
            "Kode kartu ini sudah pernah digunakan.";

        }


        if (
          message
            .toLowerCase()
            .includes("tidak ditemukan")
        ) {

          message =
            "Kode kartu tidak ditemukan. Periksa kembali kode kamu.";

        }


        showStatus(
          message
        );


      } finally {

        setLoading(false);

      }

    }


    /* =====================================================
       FIND REWARD INDEX
    ===================================================== */

    function getRewardIndex(
      rewardName
    ) {

      const normalized =
        rewardName
          .toLowerCase()
          .trim();


      /*
        Cari berdasarkan nama
        yang paling cocok.
      */

      const exact =
        rewardNames.findIndex(
          name =>
            name
              .toLowerCase()
              .trim() === normalized
        );


      if (exact !== -1) {
        return exact;
      }


      /*
        Fallback untuk variasi penulisan.
      */

      if (
        normalized.includes("pocket")
      ) {
        return 0;
      }


      if (
        normalized.includes("5000")
      ) {
        return 1;
      }


      if (
        normalized.includes("10.000") ||
        normalized.includes("10000")
      ) {
        return 2;
      }


      if (
        normalized.includes("20%")
      ) {
        return 3;
      }


      if (
        normalized.includes("10%")
      ) {
        return 4;
      }


      if (
        normalized.includes("emas")
      ) {
        return 5;
      }


      if (
        normalized.includes("30ml")
      ) {
        return 6;
      }


      return 0;
    }


    /* =====================================================
       ANIMATE RESULT
    ===================================================== */

    async function animateResult() {

      if (
        spinning ||
        !rewardData
      ) {
        return;
      }


      spinning = true;

      spinBtn.disabled =
        true;


      hideStatus();


      result.classList.remove(
        "show"
      );


      /*
        Hadiah sudah ditentukan
        oleh database.

        Sekarang hanya animasi visual.
      */

      const rewardName =
        rewardData.reward_name;


      const rewardIndex =
        getRewardIndex(
          rewardName
        );


      const segment =
        360 / rewardNames.length;


      /*
        Posisi tengah segment.
      */

      const target =
        360 -
        (
          rewardIndex * segment
          + segment / 2
        );


      /*
        Tambahkan 6 putaran penuh
        supaya animasinya terasa seperti
        spin wheel sungguhan.
      */

      rotation +=
        360 * 6 +
        target;


      wheel.style.transform =
        `rotate(${rotation}deg)`;


      /*
        Tunggu animasi selesai.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            5400
          )
      );


      /*
        Tampilkan hadiah.
      */

      resultTitle.textContent =
        rewardData.reward_name;


      resultDescription.textContent =
        rewardData.reward_description ||
        "Selamat! Kamu mendapatkan hadiah dari EVORA Rewards.";


      /*
        Kalau nanti function kita
        mengembalikan kode voucher,
        bagian ini siap digunakan.
      */

      if (
        rewardData.redeem_code
      ) {

        resultCode.textContent =
          "Kode: " +
          rewardData.redeem_code;

        resultCode.style.display =
          "block";

      } else {

        resultCode.style.display =
          "none";

      }


      result.classList.add(
        "show"
      );


      spinBtn.textContent =
        "REWARD BERHASIL";


      showStatus(
        "Selamat! Hadiah kamu berhasil didapatkan.",
        "success"
      );


      spinning =
        false;

    }


  </script>

</body>
</html>
