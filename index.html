<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EVORA Rewards</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c9a227;
      --gold-light: #f6e7a8;
      --black: #0b0b0b;
      --gray: #707070;
      --white: #ffffff;
      --bg: #f7f7f5;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(201,162,39,.16), transparent 35%),
        var(--bg);
      color: var(--black);
    }

    .container {
      width: min(100%, 520px);
      margin: auto;
      padding: 24px 18px 50px;
    }

    .brand {
      text-align: center;
      margin: 18px 0 28px;
    }

    .brand-logo {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 50%;
      background: #111;
      color: white;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
    }

    .brand h1 {
      margin-top: 16px;
      font-size: 34px;
      letter-spacing: -1.5px;
    }

    .brand p {
      margin-top: 7px;
      color: var(--gray);
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,.08);
      backdrop-filter: blur(15px);
    }

    .headline {
      text-align: center;
      margin-bottom: 22px;
    }

    .headline h2 {
      font-size: 22px;
    }

    .headline p {
      margin-top: 7px;
      color: var(--gray);
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 0 16px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
      transition: .2s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201,162,39,.12);
    }

    .btn {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn-primary {
      background: #111;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 13px 15px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #fff0f0;
      color: #a40000;
    }

    .status.success {
      background: #effaf1;
      color: #176b28;
    }

    .wheel-section {
      display: none;
      margin-top: 22px;
      text-align: center;
    }

    .wheel-section.show {
      display: block;
    }

    .wheel-wrap {
      position: relative;
      width: min(82vw, 370px);
      height: min(82vw, 370px);
      margin: 10px auto 25px;
    }

    .pointer {
      position: absolute;
      z-index: 5;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid #111;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,.25));
    }

    .wheel {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 9px solid #111;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(0,0,0,.2),
        inset 0 0 0 3px rgba(255,255,255,.5);
      background: conic-gradient(
        #111 0deg,
        #c9a227 60deg,
        #222 120deg,
        #dfc35a 180deg,
        #111 240deg,
        #e9d98e 300deg,
        #111 360deg
      );
      transition: transform 5s cubic-bezier(.12,.75,.1,1);
    }

    .wheel-center {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 50%;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: white;
      border: 7px solid #111;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1px;
      box-shadow: 0 5px 18px rgba(0,0,0,.2);
    }

    .reward-list {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .reward-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f7f7;
      padding: 12px 14px;
      border-radius: 13px;
      font-size: 13px;
    }

    .reward-name {
      font-weight: 700;
    }

    .reward-probability {
      color: var(--gray);
      font-size: 12px;
    }

    .result {
      display: none;
      text-align: center;
      padding: 24px 15px;
      margin-top: 18px;
      border-radius: 22px;
      background: linear-gradient(145deg, #fffaf0, #ffffff);
      border: 1px solid rgba(201,162,39,.35);
    }

    .result.show {
      display: block;
      animation: pop .5s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .result-icon {
      font-size: 48px;
    }

    .result h3 {
      margin-top: 10px;
      font-size: 24px;
    }

    .result p {
      margin-top: 8px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 11px;
    }

    .loading {
      display: none;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }

    .loading.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-logo">EV</div>
    <h1>EVORA REWARDS</h1>
    <p>Spin your chance. Discover your reward.</p>
  </div>

  <div class="card">

    <div class="headline">
      <h2>🎁 EVORA Rewards</h2>
      <p>
        Masukkan nomor HP dan kode kartu EVORA
        untuk mendapatkan kesempatan spin.
      </p>
    </div>

    <div class="field">
      <label for="phone">Nomor WhatsApp</label>
      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        placeholder="Contoh: 081234567890"
        autocomplete="tel"
      >
    </div>

    <div class="field">
      <label for="cardCode">Kode Kartu</label>
      <input
        id="cardCode"
        type="text"
        placeholder="Masukkan kode kartu"
        autocomplete="off"
        autocapitalize="characters"
      >
    </div>

    <button
      id="startBtn"
      class="btn btn-primary"
      onclick="startReward()"
    >
      MULAI REWARDS
    </button>

    <div id="loading" class="loading">
      Memeriksa kartu...
    </div>

    <div id="status" class="status"></div>

    <div id="wheelSection" class="wheel-section">

      <div class="wheel-wrap">

        <div class="pointer"></div>

        <div id="wheel" class="wheel"></div>

        <div class="wheel-center">
          EVORA
        </div>

      </div>

      <div id="rewardList" class="reward-list"></div>

      <button
        id="spinBtn"
        class="btn btn-primary"
        onclick="spinWheel()"
      >
        PUTAR SEKARANG
      </button>

      <div id="result" class="result">
        <div class="result-icon">🎉</div>
        <h3 id="resultTitle"></h3>
        <p id="resultDescription"></p>
      </div>

    </div>

  </div>

  <div class="footer">
    EVORA Rewards · One card, one chance
  </div>

</div>

<script>
  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://bkwcgdlwdbccbuczhtac.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dp2VMN6xlQVY1SsxXrUPkg_Wi5BXoYs";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================================================
     STATE
     ========================================================= */

  let currentCustomer = null;
  let currentCard = null;
  let rewards = [];
  let spinning = false;
  let currentRotation = 0;


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const phoneInput =
    document.getElementById("phone");

  const cardInput =
    document.getElementById("cardCode");

  const startBtn =
    document.getElementById("startBtn");

  const spinBtn =
    document.getElementById("spinBtn");

  const loading =
    document.getElementById("loading");

  const statusBox =
    document.getElementById("status");

  const wheelSection =
    document.getElementById("wheelSection");

  const rewardList =
    document.getElementById("rewardList");

  const wheel =
    document.getElementById("wheel");

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultDescription =
    document.getElementById("resultDescription");


  /* =========================================================
     HELPERS
     ========================================================= */

  function normalizePhone(value) {
    return value
      .replace(/\D/g, "")
      .trim();
  }


  function normalizeCode(value) {
    return value
      .trim()
      .toUpperCase();
  }


  function showStatus(message, type = "error") {

    statusBox.textContent = message;

    statusBox.className =
      "status show " + type;
  }


  function hideStatus() {

    statusBox.className = "status";
    statusBox.textContent = "";
  }


  function setLoading(value) {

    loading.classList.toggle(
      "show",
      value
    );

    startBtn.disabled = value;
  }


  /* =========================================================
     LOAD REWARDS
     ========================================================= */

  async function loadRewards() {

    const {
      data,
      error
    } = await db
      .from("spin_rewards")
      .select("*")
      .eq("is_active", true)
      .order("created_at", {
        ascending: true
      });

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {
      throw new Error(
        "Belum ada hadiah aktif di database."
      );
    }

    rewards = data;

    renderRewards();
  }


  /* =========================================================
     RENDER REWARDS
     ========================================================= */

  function renderRewards() {

    rewardList.innerHTML = "";

    rewards.forEach(reward => {

      const item =
        document.createElement("div");

      item.className =
        "reward-item";

      const name =
        document.createElement("span");

      name.className =
        "reward-name";

      name.textContent =
        reward.name;

      const probability =
        document.createElement("span");

      probability.className =
        "reward-probability";

      probability.textContent =
        Number(reward.probability) + "%";

      item.appendChild(name);
      item.appendChild(probability);

      rewardList.appendChild(item);
    });


    /*
      Tampilan wheel menggunakan jumlah hadiah.
      Hasil sebenarnya tetap harus divalidasi database.
    */

    const colors = [
      "#111111",
      "#c9a227",
      "#333333",
      "#e1c85a",
      "#111111",
      "#d8bf55",
      "#222222"
    ];

    const angle =
      360 / rewards.length;

    let gradient = "";

    rewards.forEach((reward, index) => {

      const start =
        index * angle;

      const end =
        (index + 1) * angle;

      gradient +=
        `${colors[index % colors.length]} ${start}deg ${end}deg`;

      if (index < rewards.length - 1) {
        gradient += ", ";
      }
    });

    wheel.style.background =
      `conic-gradient(${gradient})`;
  }


  /* =========================================================
     START REWARD
     ========================================================= */

  async function startReward() {

    hideStatus();

    const phone =
      normalizePhone(
        phoneInput.value
      );

    const code =
      normalizeCode(
        cardInput.value
      );


    if (!phone) {
      showStatus(
        "Masukkan nomor WhatsApp terlebih dahulu."
      );
      return;
    }


    if (!code) {
      showStatus(
        "Masukkan kode kartu terlebih dahulu."
      );
      return;
    }


    setLoading(true);


    try {

      /*
        Cari / buat customer
      */

      let {
        data: customer,
        error: customerError
      } = await db
        .from("customers")
        .select("*")
        .eq("phone", phone)
        .maybeSingle();


      if (customerError) {
        throw customerError;
      }


      if (!customer) {

        const {
          data: newCustomer,
          error: createCustomerError
        } = await db
          .from("customers")
          .insert({
            phone: phone,
            progress: 0,
            total_free_bottles: 0,
            spin_credits: 0
          })
          .select()
          .single();


        if (createCustomerError) {
          throw createCustomerError;
        }


        customer =
          newCustomer;
      }


      /*
        Cari kartu
      */

      const {
        data: card,
        error: cardError
      } = await db
        .from("card_codes")
        .select("*")
        .eq("code", code)
        .maybeSingle();


      if (cardError) {
        throw cardError;
      }


      if (!card) {
        throw new Error(
          "Kode kartu tidak ditemukan."
        );
      }


      if (card.is_used) {
        throw new Error(
          "Kode kartu ini sudah pernah digunakan."
        );
      }


      /*
        Simpan state
      */

      currentCustomer =
        customer;

      currentCard =
        card;


      await loadRewards();


      wheelSection.classList.add(
        "show"
      );


      startBtn.style.display =
        "none";


      phoneInput.disabled =
        true;

      cardInput.disabled =
        true;


      showStatus(
        "Kartu valid. Kamu mendapatkan 1 kesempatan spin!",
        "success"
      );


    } catch (error) {

      console.error(error);

      showStatus(
        error.message ||
        "Terjadi kesalahan. Silakan coba lagi."
      );

    } finally {

      setLoading(false);
    }
  }


  /* =========================================================
     PICK REWARD
     ========================================================= */

  function weightedReward() {

    const total =
      rewards.reduce(
        (sum, reward) =>
          sum + Number(reward.probability || 0),
        0
      );


    if (total <= 0) {
      throw new Error(
        "Probability hadiah belum diatur."
      );
    }


    let random =
      Math.random() * total;


    for (const reward of rewards) {

      random -=
        Number(reward.probability || 0);

      if (random <= 0) {
        return reward;
      }
    }


    return rewards[
      rewards.length - 1
    ];
  }


  /* =========================================================
     SPIN
     ========================================================= */

  async function spinWheel() {

    if (spinning) return;

    if (!currentCard ||
        !currentCustomer) {

      showStatus(
        "Silakan validasi kartu terlebih dahulu."
      );

      return;
    }


    spinning = true;

    spinBtn.disabled = true;

    hideStatus();

    result.classList.remove(
      "show"
    );


    try {

      /*
        Untuk tahap UI ini kita ambil reward
        berdasarkan probability dari database.

        Tahap berikutnya kita pindahkan
        penentuan hasil ke database/RPC
        agar tidak bisa dimanipulasi.
      */

      const reward =
        weightedReward();


      const rewardIndex =
        rewards.findIndex(
          r => r.id === reward.id
        );


      const segment =
        360 / rewards.length;


      const target =
        360 -
        (
          rewardIndex * segment
          + segment / 2
        );


      currentRotation +=
        360 * 6 +
        target;


      wheel.style.transform =
        `rotate(${currentRotation}deg)`;


      await new Promise(
        resolve =>
          setTimeout(resolve, 5200)
      );


      /*
        Simpan hasil spin
      */

      const {
        error: spinError
      } = await db
        .from("spins")
        .insert({
          customer_id:
            currentCustomer.id,

          reward_id:
            reward.id,

          card_code_id:
            currentCard.id
        });


      if (spinError) {
        throw spinError;
      }


      /*
        Tandai kartu sebagai digunakan
      */

      const {
        error: cardUpdateError
      } = await db
        .from("card_codes")
        .update({
          is_used: true,
          used_by:
            currentCustomer.id,
          used_at:
            new Date().toISOString()
        })
        .eq(
          "id",
          currentCard.id
        )
        .eq(
          "is_used",
          false
        );


      if (cardUpdateError) {
        throw cardUpdateError;
      }


      /*
        Tampilkan hadiah
      */

      resultTitle.textContent =
        reward.name;

      resultDescription.textContent =
        reward.description ||
        "Selamat! Kamu mendapatkan hadiah dari EVORA Rewards.";


      result.classList.add(
        "show"
      );


      spinBtn.textContent =
        "KARTU SUDAH DIGUNAKAN";


      showStatus(
        "Spin berhasil disimpan.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showStatus(
        error.message ||
        "Spin gagal diproses."
      );

      spinBtn.disabled =
        false;

    } finally {

      spinning = false;
    }
  }


  /* =========================================================
     INITIALIZE
     ========================================================= */

  console.log(
    "EVORA Rewards initialized."
  );

</script>

</body>
</html>
